name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to build, such as v1.0.0
        required: true
        type: string
      publish:
        description: Publish the draft after all assets upload
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            script: pwsh ./scripts/package-release.ps1
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            script: sh ./scripts/package-release.sh
          - os: macos-15-intel
            target: x86_64-apple-darwin
            script: sh ./scripts/package-release.sh
          - os: macos-15
            target: aarch64-apple-darwin
            script: sh ./scripts/package-release.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate tag and package version
        shell: bash
        run: |
          package_version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$package_version" = "$RELEASE_TAG" || {
            echo "Cargo.toml version $package_version does not match tag $RELEASE_TAG" >&2
            exit 1
          }
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libdbus-1-dev libgl1-mesa-dev
          libwayland-dev libx11-dev libxcursor-dev libxi-dev
          libxkbcommon-dev libxrandr-dev
      - name: Install stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
      - run: cargo build --release --locked
      - name: Package archive and checksum
        shell: bash
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Update GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create or update draft and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "BurnSubs $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
